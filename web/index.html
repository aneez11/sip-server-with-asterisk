<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151517">
  <title>Infinity Echo · Paging console</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/theme-init.js"></script>
  <style>
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      background: #f2f4f3;
      color: #151719;
      font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f2f4f3;
      transition: opacity 220ms ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-logo { width: min(320px, 72vw); height: auto; display: block; }
    .splash-bar {
      width: 180px;
      height: 3px;
      border-radius: 999px;
      overflow: hidden;
      background: #d6ded9;
    }
    .splash-bar i {
      display: block;
      height: 100%;
      width: 30%;
      border-radius: 999px;
      background: #1f7a67;
      animation: splash-slide 1.1s ease-in-out infinite;
    }
    .splash-note {
      font: 11px ui-monospace, 'Cascadia Code', SFMono-Regular, Consolas, monospace;
      color: #5a6661;
      letter-spacing: 0.04em;
    }
    @keyframes splash-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(680%); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="splash" class="splash">
    <img class="splash-logo" src="/logo-dark.svg" alt="Infinity Echo" />
    <div class="splash-bar"><i></i></div>
    <div class="splash-note">Echoing into infinity…</div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
