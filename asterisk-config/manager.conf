; manager.conf — Asterisk Manager Interface (AMI).
;
; LAN-only project, but AMI is NEVER exposed beyond the compose network
; (AGENTS.md #5: loopback or IP-restricted only). The laravel and ami-listener
; containers reach AMI over the pinned compose subnet 172.30.0.0/24; nothing
; else (LAN included) can connect, and no AMI port is published to the host.

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 172.30.0.0/255.255.255.0
deny = 0.0.0.0/0.0.0.0

[broadcastapi]
; PLACEHOLDER SECRET — generate a real random secret, store it in the Laravel
; backend .env (Phase 1+), and rotate this value before any real use.
secret = abd0c26f1e947583
; Note: AMI actions are checked against the WRITE class (PJSIPShowContacts
; needs `system`), events against READ.
read = call,agent,system,command
write = call,originate,command,reporting,system
