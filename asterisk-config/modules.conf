; modules.conf — load the full PJSIP stack; keep deprecated/unneeded channels
; out of the picture. Page() depends on app_confbridge (autoloaded).

[modules]
autoload = yes

; Deprecated SIP channel — this project uses PJSIP only.
noload => chan_sip.so

; ODBC-backed realtime config is explicitly deferred (PLAN.md §5.3, AGENTS.md #8).
noload => res_odbc.so
