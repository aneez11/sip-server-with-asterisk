; pjsip.conf.tmpl — SOURCE OF TRUTH for pjsip.conf.
;
; This template is rendered to /etc/asterisk/pjsip.conf by the Asterisk
; entrypoint at container start (docker/asterisk/entrypoint.sh). The literal
; token 10.20.30.20 is replaced with the $HOST_IP env var — the Docker host's
; LAN IP — so the SDP advertises a reachable address regardless of where the
; system is deployed. Do not hand-edit the generated pjsip.conf; edit this
; template instead.
;
; Layout:
;   - [transport-udp] is STATIC (only HOST_IP is templated).
;   - Template sections ([endpoint-tpl], [auth-tpl], [aor-tpl]) live here.
;   - Endpoint instances are generated by the API into endpoints.conf,
;     included at the bottom of this file.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Docker Desktop NAT: the container lives on 172.30.0.0/24 but the LAN
; reaches the host at $HOST_IP. Without external_media_address the SDP would
; advertise the unreachable container IP and RTP would fail.
; These settings are safe to remove on a Linux host with network_mode: host.
; local_net = the container's own network. Peers NOT in this list (the LAN
; phones at $HOST_IP's subnet) get their SDP rewritten to external_media_address,
; so they send RTP to the Docker host (published) instead of the unreachable
; container IP.
local_net = 172.30.0.0/255.255.255.0
external_media_address = 10.20.30.20

; ---------------------------------------------------------------------------
; Templates — endpoint instances are generated by the API into endpoints.conf
; ---------------------------------------------------------------------------
[endpoint-tpl](!)
type = endpoint
; Inbound calls from an endpoint enter the [internal] context so handsets can
; dial each other. Broadcasts never touch this — they originate
; Local/9000@paging directly, so [paging] stays the only place Page() runs.
context = internal
; Force media through Asterisk (no direct RTP between handsets). Phones
; advertise each other's LAN RTP ports when direct_media is on, but they never
; actually exchange audio that way in this Docker-NAT topology — every working
; path (paging, live talk, phone<->PC) routes RTP via Asterisk.
direct_media = no
; Advertise the Docker host LAN address in SDP media so phones send RTP to the
; published port range, not the unreachable container IP. The transport's
; external_media_address only rewrites outbound offers, not inbound answers —
; media_address covers both directions.
media_address = 10.20.30.20
; Codec: G.711 ulaw only — narrowband fallback that every phone/speaker
; negotiates reliably. G.722 was removed after negotiation issues; revisit if
; wideband clarity is needed on devices that support it.
disallow = all
allow = !all,ulaw

[auth-tpl](!)
type = auth
auth_type = userpass
realm = asterisk

[aor-tpl](!)
type = aor
max_contacts = 2
; Replace the previous contact on re-registration instead of accumulating a
; second one. Softphones/mobile SIP apps re-register from changing source ports
; (and through Docker's NAT the source port is not stable), which used to fill
; the AOR to max_contacts and then REJECT further registrations with
; "will exceed max contacts of N" — leaving the device offline until restart.
remove_existing = yes
qualify_frequency = 30

; Generated by the API config regen — do not hand-edit endpoints.conf
#include endpoints.conf

[transport-tcp-test]
type = transport
protocol = tcp
bind = 0.0.0.0:5062

; ---------------------------------------------------------------------------
; WebSocket transport for the live-talk operator console (browser SIP.js).
; res_pjsip_transport_websocket.so + res_http_websocket.so are loaded (modules.conf).
; DTLS cert for WebRTC lives in /etc/asterisk/certs (bind-mounted).
; ---------------------------------------------------------------------------
[transport-ws]
type = transport
protocol = websocket
bind = 0.0.0.0:5061

; ---------------------------------------------------------------------------
; Operator console endpoint — the browser registers here via SIP.js over the
; WebSocket transport and becomes the LIVE announcer for live broadcasts.
; Static on purpose (not in endpoints.conf): it is not a paging endpoint.
; Keep LIVETALK_PASSWORD in sync with api .env (LIVETALK_PASSWORD).
; ---------------------------------------------------------------------------
[operator-tpl](!)
type = endpoint
context = livetalk
disallow = all
allow = !all,ulaw
; WebRTC / DTLS-SRTP settings for the browser (SIP.js) client.
webrtc = yes
direct_media = no
rtcp_mux = yes
media_encryption = srtp
ice_support = yes
use_avpf = yes
dtls_cert_file = /etc/asterisk/certs/asterisk.pem
dtls_private_key = /etc/asterisk/certs/asterisk.key
dtls_verify = fingerprint
dtls_setup = passive

[operator-auth](!)
type = auth
auth_type = userpass
realm = asterisk

[operator-aor](!)
type = aor
max_contacts = 1
qualify_frequency = 30

[9999](operator-tpl)
auth = 9999-auth
aors = 9999

[9999-auth](operator-auth)
username = 9999
password = livetalk-op-pass

[9999](operator-aor)

; ---------------------------------------------------------------------------
; Operator UA endpoint — the API's SIP/RTP bridge for LIVE talk (browser mic ->
; Asterisk). NOT a browser/WebRTC device: a plain PCMU RTP UA identified by its
; container IP (the API service on the compose network; docker-compose.yml pins
; the API to 172.30.0.4 so this match stays valid). Calls enter the [operator]
; context.
; ---------------------------------------------------------------------------
[operator-ua]
type = endpoint
context = operator
disallow = all
allow = !all,ulaw
direct_media = no

[operator-ua-identify]
type = identify
endpoint = operator-ua
match = 172.30.0.4/32
