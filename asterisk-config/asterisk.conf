; asterisk.conf — explicit paths + verbose console output for Phase 0.
; The distro package writes defaults here on install; these override them so
; the container behaves predictably.
;
; astmoddir is intentionally NOT set here: Ubuntu installs modules under the
; multiarch path (/usr/lib/x86_64-linux-gnu/asterisk/modules), and the
; compiled-in default is the correct, architecture-safe choice.

[directories](!)
astcachedir => /var/cache/asterisk
astetcdir   => /etc/asterisk
astvarlibdir => /var/lib/asterisk
astdbdir    => /var/lib/asterisk
astkeydir   => /var/lib/asterisk
astdatadir  => /var/lib/asterisk
astagidir   => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir   => /var/run/asterisk
astlogdir   => /var/log/asterisk

[options]
verbose = 3
