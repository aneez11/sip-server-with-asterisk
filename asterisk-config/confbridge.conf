; confbridge.conf — required by app_confbridge, which the paging dialplan uses
; to replicate Page() with Dial() (Page() itself cannot inject the auto-answer
; SIP header in this build).
;
; Because the bind mount shadows the distro's /etc/asterisk, this file must
; exist or app_confbridge will refuse to load.

[general]

[default_user]
type=user

[default_bridge]
type=bridge

; ---------------------------------------------------------------------------
; Paging bridge: one-way broadcast. The announcer is a marked speaker; every
; paged member joins muted (startmuted=yes) so they can hear but not talk
; back. The bridge lives and dies with the marked announcer.
; ---------------------------------------------------------------------------
[paging_bridge]
type=bridge
; Silence the bridge's default announcements by playing silence instead of the
; confbridge-join/leave, conf-onlyperson, and conf-leaderhasleft prompts.
; Empty strings did not suppress them; silence/1 plays a quiet quarter-second.
sound_join=silence/1
sound_leave=silence/1
sound_has_other_party=silence/1
sound_only_person=silence/1
sound_leader_has_left=silence/1

[paging_caller]
type=user
; The announcer is the marked participant — the page ends when they leave.
; It MUST be able to speak (do NOT set quiet here), so the WAV reaches members.
marked=yes

[paging_caller]
type=user
; The announcer is the marked participant — the page ends when they leave.
; It MUST be able to speak (do NOT set quiet here), so the WAV reaches members.
marked=yes
; Don't play ConfBridge's join/leave beeps or "only user" announcements — this
; way only the PA start/end tones are heard, not a computer voice.
announce_join_leave=no
announce_only_user=no

[paging_user]
type=user
; One-way: paged members are muted and cannot speak into the page.
startmuted=yes
quiet=yes
; Kick members when the last marked (announcer) user leaves — ends the page.
end_marked=yes
announce_join_leave=no
announce_only_user=no

; PA receiver — like paging_user but does NOT end_marked. The initiator (the
; device that dialed the group extension) is the marked speaker; when it hangs
; up the API plays pa_end into the still-joined receivers, THEN hangs them up.
[paging_pa_user]
type=user
startmuted=yes
quiet=yes
announce_join_leave=no
announce_only_user=no

; PA start/end tone announcer — a marked, unmuted leg whose audio reaches the
; muted paging_pa_user receivers. It plays the boundary tone then leaves; the
; initiator device (dialing the group extension) becomes the marked live
; speaker after it departs.
[paging_pa_tone]
type=user
marked=yes
announce_join_leave=no
announce_only_user=no

; PA start/end hold announcer — plays into the conf but is NOT the marked
; speaker (the initiator device that dialed the group extension is). Unmuted so
; the mixer feeds its playback to the members.
[paging_announcer]
type=user
; startmuted is NOT set: this leg must be heard by the members.
; Not marked: the initiator is the marked speaker that keeps the conf alive.
announce_join_leave=no
announce_only_user=no

