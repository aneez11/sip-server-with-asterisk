; extensions.conf — static paging + intercom dialplan.
;
; The dialplan NEVER changes per zone or per broadcast. All dynamism travels
; through channel variables set per call via AMI Originate
; (PAGE_MEMBERS, PAGE_CONF, BROADCAST_LOG_ID — PLAN.md §5.2, AGENTS.md #3).
;
; Paging is one-way and replicated with Dial + ConfBridge. Each broadcast is
; TWO AMI Originate calls that share one conference name (PAGE_CONF):
;
;   1. Announcer  -> Local/announce@paging-bridge  (Application: Playback)
;        the ;1 leg joins the conference as the MARKED speaker
;        (paging_caller); the ;2 leg feeds the WAV into it. The ConfBridge
;        mixer drains the speaker at realtime, so audio is streamed in chunks
;        rather than queued as a single blob onto the Local channel — this is
;        what fixes the "Exceptionally long voice queue length" warning that a
;        plain Dial+Playback produced.
;   2. Members     -> Local/9000@paging  (Application: Wait anchor)
;        the ;1 leg Dial()s every target and the per-callee U() Gosub joins
;        each answered member, MUTED, into the SAME conference (paging_user).
;        b(paging-autoanswer^s^1) adds `Alert-Info: Auto Answer` to each INVITE.
; The page ends when the marked announcer leaves (confbridge end_marked=yes).
;
; Contexts: [internal], [paging], [music], [paging-autoanswer], [paging-join],
; [paging-bridge], [music-bridge].

[general]

[internal]
; Guard the paging extension — dialing 9000 from a handset must not attempt
; to place a call to a "9000" endpoint (which does not exist).
exten => 9000,1,Hangup()

; PA group trigger: an initiator device dials a group extension (_91XX-99XX,
; 4 digits). The AGI hook resolves the group via the API, sets PA_CONF /
; PA_START / PA_END, and originates the receiver member legs + hold announcer.
; The initiator then plays pa_start, joins the conf as the marked speaker (its
; mic is live to the receivers), and plays pa_end when it hangs up — so the
; boundary tones reach the receivers over the marked speaker path.
exten => _9[1-9]XX,1,AGI(/etc/asterisk/agi/pa-launch.sh,${EXTEN})
 same => n,Answer()
 same => n,GotoIf($[${LEN(${PA_CONF})} > 0]?launch)
 same => n,Hangup()
 same => n(launch),ConfBridge(${PA_CONF},paging_bridge,paging_caller)
 same => n,Hangup()

; Two-way calls: dial the requested extension on its PJSIP endpoint. Literal
; 9000 above wins over this pattern. Unregistered/unknown extensions simply
; fail the dial (channel unavailable).
exten => _X.,1,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

[paging]
; Members originate. ;1 Dial()s the targets (auto-answer via the predial
; Gosub); the U() Gosub drops each answered member, muted, into the conference.
; ;2 is an idle Wait anchor that keeps the Local channel alive for the call.
exten => 9000,1,Answer()
; Show the broadcast title (PAGE_TITLE from the API) as caller-id name so the
; announcement name is visible on phone displays. Number stays the endpoint's
; configured callerid. Static edit — no per-zone regen.
 same => n,ExecIf($[${LEN(${PAGE_TITLE})} > 0]?Set(CALLERID(name)=${PAGE_TITLE}))
; Per-zone auto-answer profile can override the dial timeout (_DTIME).
; NOTE: b() and U() are BOTH Dial options — no comma between them, or U() is
; parsed as the 4th (URL) argument and paging-join never runs (no audio).
 same => n,Dial(${PAGE_MEMBERS},${IF($[${LEN(${DTIME})} > 0]?${DTIME}:30)},b(paging-autoanswer^s^1)U(paging-join^s^1))
 same => n,Hangup()

[music]
; Same machinery as [paging] with no beep.
exten => 9001,1,Answer()
 same => n,ExecIf($[${LEN(${PAGE_TITLE})} > 0]?Set(CALLERID(name)=${PAGE_TITLE}))
 same => n,Dial(${PAGE_MEMBERS},${IF($[${LEN(${DTIME})} > 0]?${DTIME}:30)},b(paging-autoanswer^s^1)U(paging-join^s^1))
 same => n,Hangup()

[paging-autoanswer]
; Sets the auto-answer header on a leg right before Dial() sends its INVITE.
; Per-zone profile variables (from the API: _ALERTINFO/_CALLINFO/_SIPURI/_DTIME)
; take precedence; defaults apply when unset.
; NOTE: ; in values must be escaped as \; to avoid dialplan comment parsing.
exten => s,1,ExecIf($[${LEN(${ALERTINFO})} > 0]?Set(PJSIP_HEADER(add,Alert-Info)=${ALERTINFO}))
 same => n,ExecIf($[${LEN(${ALERTINFO})} = 0]?Set(PJSIP_HEADER(add,Alert-Info)=Auto Answer))
 same => n,ExecIf($[${LEN(${CALLINFO})} > 0]?Set(PJSIP_HEADER(add,Call-Info)=${CALLINFO}))
 same => n,ExecIf($[${LEN(${CALLINFO})} = 0]?Set(PJSIP_HEADER(add,Call-Info)=<sip:autoanswer>\;answer-after=0))
 same => n,ExecIf($[${LEN(${SIPURI})} > 0]?Set(PJSIP_HEADER(add,Intercom)=${SIPURI}))
 same => n,ExecIf($[${LEN(${SIPURI})} = 0]?Set(PJSIP_HEADER(add,Intercom)=true))
 same => n,Return()

[paging-join]
; Answered member -> join the paging conference muted (one-way paging).
; If a per-zone volume (PVOL, 0-100) is set via the API, apply it to the
; member's transmit so the phone plays the page at the configured level.
; PVOL mirrors PAGE_CONF propagation (both are plain variables on the
; calling Local channel, available to the U() gosub on the called channel).
;
; Ends with Hangup() — NOT Return(). When the marked announcer leaves, the
; conf kicks members (end_marked); returning to Dial would re-bridge the
; kicked member to the member-leg Local channel in a simple_bridge that never
; ends, leaving the device busy and the page stuck. Hanging up ends the member
; cleanly, Dial returns, and the member leg tears down.
exten => s,1,ExecIf($[${LEN(${PVOL})} > 0]?Set(VOLUME(TX)=${PVOL}))
 same => n,ConfBridge(${PAGE_CONF},paging_bridge,${IF($[${LEN(${PAGE_ROLE})} > 0]?${PAGE_ROLE}:paging_user)})
 same => n,Hangup()

[paging-bridge]
; Announcer ;1 leg: join the conference as the marked speaker. The ;2 leg
; (AMI Application: Playback) feeds the announcement into it.
exten => announce,1,ConfBridge(${PAGE_CONF},paging_bridge,paging_caller)
 same => n,Hangup()

[music-bridge]
; Music announcer ;1 leg (no beep); same marked-speaker role as [paging-bridge].
exten => announce,1,ConfBridge(${PAGE_CONF},paging_bridge,paging_caller)
 same => n,Hangup()

; PA announcement hold + tone handlers. The API originates:
;   - Local/announce@pa-announce (Application: Wait) for the HOLD leg: ;2 runs
;     `announce` (join the conf as paging_announcer — unmuted, non-marked) while
;     ;1 waits, keeping the conference alive.
;   - Local/announce@pa-announce (Application: Playback, _PA_ROLE=paging_pa_tone)
;     for the PA START/END tone: ;1 plays the tone, ;2 joins as paging_pa_tone
;     (marked) so its audio reaches the muted receivers; it leaves when ;1 ends.
; The initiator (which dialed the group extension) joins as the marked live
; speaker once the tone announcer departs.
[pa-announce]
exten => announce,1,ConfBridge(${PAGE_CONF},paging_bridge,${IF($[${LEN(${PA_ROLE})} > 0]?${PA_ROLE}:paging_announcer)})
 same => n,Hangup()

; ---------------------------------------------------------------------------
; [operator] — dialplan for the API's live-talk operator UA (operator-ua
; endpoint). Two entry points:
;
;   live  : the UA joins the paging ConfBridge as the MARKED live speaker
;           (paging_caller). The API originates the standard member leg with
;           the same PAGE_CONF (passed via X-Asterisk-Variable in the INVITE),
;           so endpoints answer and hear the live stream one-way.
;   _X.   : two-way talk — the UA dials a phone endpoint directly (a normal
;           two-way call) when exactly one phone endpoint is selected.
; ---------------------------------------------------------------------------
[operator]
; Live broadcast: the operator UA calls "live-<PAGE_CONF>" — the conference name
; is carried in the Request-URI (this Asterisk build does not apply
; X-Asterisk-Variable headers). The UA joins the conf as the MARKED live speaker
; (paging_caller); the API's member leg joins endpoints muted.
exten => _live-.,1,Set(PAGE_CONF=${EXTEN:5})
 same => n,Answer()
 same => n,ConfBridge(${PAGE_CONF},paging_bridge,paging_caller)
 same => n,Hangup()

exten => _X.,1,Dial(PJSIP/${EXTEN},60,tT)
 same => n,Hangup()
